[package]
name = "co-jolt-coordinator"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Coordinator-side MPC proving for co-jolt2"
license.workspace = true

[dependencies]
co-jolt2 = { path = "../co-jolt2" }
mpc-core = { path = "../mpc-core" }
mpc-net = { path = "../mpc-net" }

jolt-core.workspace = true
jolt2-common = { workspace = true, package = "jolt-common" }
tracer = { workspace = true }

ark-bn254.workspace = true
ark-ec.workspace = true
ark-ff.workspace = true
ark-serialize.workspace = true
ark-poly-commit.workspace = true
eyre.workspace = true
tracing.workspace = true
rayon = "1.10.0"
serde.workspace = true
itertools.workspace = true
dory = { git = "https://github.com/markosg04/dory", branch = "dev/twist-shout" }
rand.workspace = true
num-traits.workspace = true
strum = "0.26.3"
snarks-core = { path = "../snarks-core" }
clap.workspace = true
color-eyre.workspace = true
toml.workspace = true
rustls.workspace = true
ark-std.workspace = true
num_cpus = "1.16"
postcard = { version = "1.0.8", default-features = false, features = ["use-std"] }
bincode = "1.3.3"
tokio = { version = "1.34.0", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "io-util",
    "macros",
] }
tracing-subscriber.workspace = true
tracing-forest.workspace = true
tracing-chrome.workspace = true
tracing-tracy = { version = "0.11", features = ["flush-on-exit"] }
tracy-client = { version = "0.18", default-features = false, features = ["enable", "manual-lifetime"] }
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"] }
libc = "0.2"

[features]
rv64 = ["co-jolt2/rv64"]

[dev-dependencies]
co-jolt2 = { path = "../co-jolt2", features = ["test-utils"] }
rcgen = "0.13"
