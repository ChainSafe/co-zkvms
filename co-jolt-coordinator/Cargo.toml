[package]
name = "co-jolt-coordinator"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Coordinator-side MPC proving for co-jolt2"
license.workspace = true

[[bin]]
name = "coordinator"
path = "src/bin/coordinator.rs"

[[bin]]
name = "host_proxy"
path = "src/bin/host_proxy.rs"
required-features = ["aws_nitro"]

[dependencies]
mpc-core = { path = "../mpc-core" }
mpc-net = { path = "../mpc-net", features = ["tls"] }
mpc-types = { path = "../mpc-types" }

jolt-core.workspace = true
jolt-common.workspace = true
tracer = { workspace = true }

ark-bn254.workspace = true
ark-std.workspace = true
ark-ec.workspace = true
ark-ff.workspace = true
ark-serialize.workspace = true
eyre.workspace = true
tracing.workspace = true
serde.workspace = true
bincode.workspace = true
rayon = "1.10.0"
itertools.workspace = true
dory.workspace = true
rand.workspace = true
num-traits.workspace = true
strum = "0.26.3"

clap = { version = "4", features = ["derive"] }
toml = "0.8"

# Transport / E2EE
rcgen = "0.13"
rustls = { version = "0.23.15", default-features = false, features = ["std", "tls12", "ring"] }
vsock = { version = "0.5", optional = true }
aws-nitro-enclaves-nsm-api = { version = "0.4", optional = true }

[features]
default = ["zk"]
rv64 = ["jolt-core/rv64", "jolt-common/rv64", "tracer/rv64"]
aws_nitro = ["dep:vsock", "dep:aws-nitro-enclaves-nsm-api"]
zk = ["jolt-core/zk"]

[dev-dependencies]
co-jolt2 = { path = "../co-jolt2", features = ["test-utils"] }
