[package]
name = "co-jolt2"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
allocative.workspace = true
ark-poly-commit.workspace = true
ark-std.workspace = true
ark-ff.workspace = true
ark-bn254.workspace = true
ark-serialize.workspace = true
ark-poly.workspace = true
ark-ec.workspace = true
rand.workspace = true
serde.workspace = true
itertools.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-forest.workspace = true
tracing-chrome.workspace = true
tracing-tracy = { version = "0.11", features = ["flush-on-exit"] }
tracy-client = { version = "0.18", default-features = false, features = ["enable", "manual-lifetime"] }
color-eyre.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
eyre.workspace = true
rand_chacha.workspace = true
once_cell = "1.20.0"
libc = "0.2"
num_cpus = "1.16"
tikv-jemalloc-ctl = { version = "0.6", optional = true, features = ["stats"] }

toml.workspace = true
rustls.workspace = true
paste = "1.0.15"
enum_dispatch = "0.3.12"
strum = "0.26.3"
strum_macros = "0.26.4"
rayon = { version = "1.10.0" }
tokio = { version = "1.34.0", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "io-util",
    "macros",
] }
# Jolt dependencies (path deps to examples/jolt fork)
jolt-core.workspace = true
jolt2-common.workspace = true
tracer.workspace = true
postcard = { version = "1.0.8", default-features = false, features = [
    "use-std",
] }
serde_json = "1.0.130"
bincode = "1.3.3"
dory = { git = "https://github.com/markosg04/dory", branch = "dev/twist-shout" }

mpc-core = { path = "../mpc-core" }
snarks-core = { path = "../snarks-core" }
mpc-net = { path = "../mpc-net" }
rcgen = { version = "0.13", optional = true }

tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
co-jolt2 = { path = ".", features = ["test-utils"] }
rcgen = "0.13"

[build-dependencies]
jolt2-common.workspace = true

[[example]]
name = "rep3_jolt"
required-features = ["test-utils"]

[[bench]]
name = "fwht"
harness = false

[features]
default = ["std", "debug"]
std = [
    "ark-ff/std",
    "ark-poly/std",
    "ark-std/std",
    "ark-serialize/std",
    "ark-poly-commit/std",
]
debug = []
test-utils = ["rcgen", "mpc-core/test-utils"]
reuse-preproc = ["mpc-core/reuse-preproc"]
tracy-mem = []
rv32 = ["jolt-core/rv32", "jolt2-common/rv32", "tracer/rv32"]
jemalloc-stats = ["dep:tikv-jemalloc-ctl"]
