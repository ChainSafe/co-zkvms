itertools.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-forest.workspace = true
tracing-chrome.workspace = true
color-eyre.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
eyre.workspace = true
rand_chacha.workspace = true
once_cell = "1.20.0"
num_cpus = "1.16"

toml.workspace = true
rustls.workspace = true
paste = "1.0.15"
enum_dispatch = "0.3.12"
strum = "0.26.3"
strum_macros = "0.26.4"
rayon = { version = "1.10.0" }
tokio = { version = "1.34.0", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "io-util",
    "macros",
] }
# Jolt dependencies (path deps to examples/jolt fork)
jolt-core = { path = "/Users/timofey/repos/examples/jolt/jolt-core" }
jolt2-common = { path = "/Users/timofey/repos/examples/jolt/common", package = "common" }
tracer = { path = "/Users/timofey/repos/examples/jolt/tracer" }
postcard = { version = "1.0.8", default-features = false, features = [
    "use-std",
] }
serde_json = "1.0.130"
bincode = "1.3.3"
dory = { git = "https://github.com/markosg04/dory", branch = "dev/twist-shout" }

mpc-core = { path = "../mpc-core" }
snarks-core = { path = "../snarks-core" }
mpc-net = { path = "../mpc-net" }
rcgen = { version = "0.13", optional = true }

[dev-dependencies]
co-jolt2 = { path = ".", features = ["test-utils"] }
rcgen = "0.13"

[build-dependencies]
jolt2-common = { path = "/Users/timofey/repos/examples/jolt/common", package = "common" }

[[example]]
name = "rep3_jolt"
required-features = ["test-utils"]

[[bench]]
name = "fwht"
harness = false

[features]
default = ["std", "debug"]
std = [
    "ark-ff/std",
    "ark-poly/std",
    "ark-std/std",
    "ark-serialize/std",
    "ark-poly-commit/std",
]
debug = []
test-utils = ["rcgen", "mpc-core/test-utils"]
